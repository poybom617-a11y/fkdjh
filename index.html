<!DOCTYPE html>

<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Birthday Invitation</title>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

body{
    width:100vw;
    height:100vh;
    overflow:hidden;
    display:flex;
    justify-content:center;
    align-items:center;
    background:linear-gradient(180deg,#edf6ff,#d7e9ff);
    font-family:sans-serif;
}

.container{
    position:relative;
    width:100%;
    height:100%;
    display:flex;
    justify-content:center;
    align-items:center;
}

/* 초대장 */

.card{
    position:absolute;
    width:min(92vw,700px);
    opacity:0;
    z-index:5;

    transform:
        translateY(220px)
        scale(.25);

    transition:
        transform 1.8s cubic-bezier(.16,1,.3,1),
        opacity 1s;
}

.card img{
    width:100%;
    display:block;
    border-radius:20px;
    box-shadow:0 25px 60px rgba(0,0,0,.25);
}

/* 봉투 */

.envelope{
    position:absolute;
    width:min(80vw,420px);
    height:min(52vw,260px);
    cursor:pointer;
    z-index:20;
}

.back{
    position:absolute;
    inset:0;
    background:#c8ddff;
    border-radius:0 0 18px 18px;
}

.front{
    position:absolute;
    inset:0;
    background:#a9cbff;

    clip-path:polygon(
        0 0,
        50% 55%,
        100% 0,
        100% 100%,
        0 100%
    );
}

.flap{
    position:absolute;
    width:100%;
    height:55%;
    top:0;

    background:#8ebcff;

    clip-path:polygon(
        0 0,
        50% 100%,
        100% 0
    );

    transform-origin:top;
    transition:transform 1s ease;
}

.hint{
    position:absolute;
    width:100%;
    bottom:-55px;
    text-align:center;
    font-weight:700;
    color:#5b7fc0;
}

/* 열림 */

.open .flap{
    transform:rotateX(180deg);
}

.show-card .card{
    opacity:1;
    transform:
        translateY(-40px)
        scale(1);
}

/* 봉투 제거 */

.remove-envelope .envelope{
    opacity:0;
    transform:translateY(120px);
    pointer-events:none;
    transition:all .8s ease;
}

/* 최종 */

.finish .card{
    transform:
        translateY(0)
        scale(1);
}

/* 모바일 */

@media(max-width:768px){

.card{
    width:96vw;
}

}
</style>

</head>

<body>

<div class="container" id="container">

```
<div class="card">
    <img
    src="https://cdn.discordapp.com/attachments/1398286165324468308/1516456048796504115/birthday.png.png?ex=6a32b540&is=6a3163c0&hm=0c4fc8fc4590f1fe39b5df9714ee49ba6160224d8e410ec8b5c32324be45130b&"
    alt="Birthday Invitation">
</div>

<div class="envelope" id="envelope">

    <div class="back"></div>
    <div class="flap"></div>
    <div class="front"></div>

    <div class="hint">
        💌 클릭해서 초대장 열기
    </div>

</div>
```

</div>

<script>

const container = document.getElementById("container");
const envelope = document.getElementById("envelope");

let opened = false;

envelope.addEventListener("click", () => {

    if(opened) return;
    opened = true;

    container.classList.add("open");

    setTimeout(() => {
        container.classList.add("show-card");
    }, 700);

    setTimeout(() => {
        container.classList.add("remove-envelope");
    }, 1700);

    setTimeout(() => {
        container.classList.add("finish");
    }, 2200);

});

</script>

</body>
</html>
